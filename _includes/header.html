{%- assign home = '/' | relative_url -%}
<header class="site-header container{% if page.url == '/' %} is-home{% endif %}">
  {%- unless page.url == '/' %}
  <a class="site-name" href="{{ home }}">← {{ site.title }}</a>
  {%- endunless %}
  <nav aria-label="Main">
    <ul>
      <li><a href="{{ home }}#about">About</a></li>
      <li><a href="{{ home }}#projects"{% if page.collection == 'projects' %} aria-current="true"{% endif %}>Projects</a></li>
      <li><a href="{{ home }}#publications">Publications</a></li>
      <li><a href="{{ home }}#news">News</a></li>
      {%- if site.data.profile.cv %}
      <li><a href="{{ site.data.profile.cv | relative_url }}" target="_blank" rel="noopener">CV</a></li>
      {%- endif %}
    </ul>
  </nav>
</header>
